<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 200 200">
<defs><pattern id="st" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#c6ff00"/><rect width="5" height="14" fill="#ff3fa4" opacity=".35"/></pattern></defs>
<rect width="200" height="200" fill="url(#st)"/>
<g transform="translate(23 6) scale(.77)">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#7ff7ec"/><stop offset=".6" stop-color="#00c2b2"/><stop offset="1" stop-color="#00796f"/></radialGradient>
    <radialGradient id="skin" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffe6d2"/><stop offset=".55" stop-color="#f7bf9a"/><stop offset="1" stop-color="#d98a62"/></radialGradient>
    <linearGradient id="skinL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e09a72"/><stop offset=".45" stop-color="#ffd9bd"/><stop offset="1" stop-color="#d98a62"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#fff6c4"/><stop offset=".35" stop-color="#ffe07a"/><stop offset=".75" stop-color="#e8b93c"/><stop offset="1" stop-color="#b0821e"/></linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8ccc"/><stop offset=".45" stop-color="#ff3fa4"/><stop offset="1" stop-color="#a3115f"/></linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#140b2e"/><stop offset=".4" stop-color="#4a3790"/><stop offset=".55" stop-color="#2b1d5c"/><stop offset="1" stop-color="#0d0720"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7b0"/><stop offset=".4" stop-color="#ffd23a"/><stop offset=".7" stop-color="#d79a00"/><stop offset="1" stop-color="#8f5d00"/></linearGradient>
    <linearGradient id="pram" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7ff5a"/><stop offset=".5" stop-color="#9ccc00"/><stop offset="1" stop-color="#5f7d00"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset=".5" stop-color="#5b2bd6"/><stop offset="1" stop-color="#2e1280"/></linearGradient>
    <radialGradient id="tyre" cx="40%" cy="35%" r="65%"><stop offset="0" stop-color="#4a4a5a"/><stop offset="1" stop-color="#111"/></radialGradient>
    <radialGradient id="hub" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffb04d"/><stop offset="1" stop-color="#d06a00"/></radialGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfd3e0"/></linearGradient>
    <radialGradient id="leo" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#e08a1e"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#1b1030" flood-opacity=".35"/></filter>
    <clipPath id="disc"><circle cx="100" cy="100" r="98"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="98" fill="url(#bg)"/>
  <g clip-path="url(#disc)">
    <circle cx="70" cy="62" r="60" fill="#fff" opacity=".12"/>
    <ellipse cx="108" cy="186" rx="80" ry="8" fill="#003b36" opacity=".35"/>

    <!-- ===== PUSHCHAIR ===== -->
    <g filter="url(#sh)" transform="translate(-10 -6)">
      <!-- frame -->
      <path d="M120 96 L134 170 M166 132 L176 170 M128 140 L170 140" stroke="#2a2a38" stroke-width="4" stroke-linecap="round" fill="none"/>
      <!-- seat bucket -->
      <path d="M124 104 Q122 140 140 146 L172 146 Q182 144 182 128 L182 112 Q160 116 124 104Z" fill="url(#pram)"/>
      <path d="M128 110 Q150 118 180 116" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none"/>
      <!-- kid -->
      <path d="M140 122 Q141 108 152 107 Q163 108 164 122 L164 132 L140 132Z" fill="url(#leo)"/>
      <g fill="#5a2a00" opacity=".85">
        <path d="M145 115 q2 -2 4 0 q-1 3 -4 0z"/><path d="M155 113 q2 -2 4 0 q-1 3 -4 0z"/>
        <path d="M149 122 q2 -2 4 0 q-1 3 -4 0z"/><path d="M158 124 q2 -2 4 0 q-1 3 -4 0z"/>
        <path d="M143 127 q2 -2 4 0 q-1 3 -4 0z"/>
      </g>
      <circle cx="152" cy="98" r="10.5" fill="url(#skin)"/>
      <path d="M143 95 Q146 86 154 87 Q161 88 162 95 Q156 90 150 93 Q146 91 143 95Z" fill="url(#hair)"/>
      <ellipse cx="148.5" cy="99" rx="1.4" ry="1.8" fill="#2a1a12"/><ellipse cx="156" cy="99" rx="1.4" ry="1.8" fill="#2a1a12"/>
      <circle cx="148" cy="98.3" r=".5" fill="#fff"/><circle cx="155.5" cy="98.3" r=".5" fill="#fff"/>
      <path d="M149 104 Q152.5 106.5 156 104" stroke="#c4406b" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <ellipse cx="145.5" cy="103" rx="2.2" ry="1.3" fill="#ff7aa8" opacity=".5"/><ellipse cx="159" cy="103" rx="2.2" ry="1.3" fill="#ff7aa8" opacity=".5"/>
      <!-- hood -->
      <path d="M126 104 Q128 72 160 70 Q184 72 186 100 Q176 92 162 86 Q140 84 126 104Z" fill="url(#hood)"/>
      <path d="M134 94 Q146 76 170 76" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M142 80 L146 88 M157 73 L159 85 M172 76 L173 88" stroke="#2a0f75" stroke-opacity=".45" stroke-width="1.5"/>
      <!-- handle -->
      <path d="M124 104 Q116 96 112 86" stroke="#2a2a38" stroke-width="5" stroke-linecap="round" fill="none"/>
      <rect x="104" y="80" width="14" height="8" rx="4" fill="#ff3fa4"/>
      <!-- wheels -->
      <g class="wheel"><circle cx="134" cy="172" r="13" fill="url(#tyre)"/><circle cx="134" cy="172" r="6" fill="url(#hub)"/><path d="M134 160v24M122 172h24" stroke="#ffd23a" stroke-width="1.6"/></g>
      <g class="wheel"><circle cx="176" cy="172" r="13" fill="url(#tyre)"/><circle cx="176" cy="172" r="6" fill="url(#hub)"/><path d="M176 160v24M164 172h24" stroke="#ffd23a" stroke-width="1.6"/></g>
    </g>

    <!-- ===== WOMAN ===== -->
    <g filter="url(#sh)">
      <!-- ponytail (behind) -->
      <path d="M58 34 Q38 22 30 40 Q26 58 34 74 Q36 58 44 50 Q50 44 60 44Z" fill="url(#hair)"/>
      <path d="M36 44 Q33 56 35 68" stroke="#fff7c8" stroke-width="1.6" fill="none" opacity=".8"/>
      <rect x="54" y="33" width="7" height="6" rx="2" transform="rotate(-25 57 36)" fill="#ff3fa4"/>

      <!-- back leg -->
      <path d="M64 120 Q58 146 50 170 L60 172 Q70 150 76 124Z" fill="url(#leg)"/>
      <!-- front leg -->
      <path d="M74 118 Q90 140 98 168 L108 166 Q102 140 88 116Z" fill="url(#leg)"/>
      <path d="M80 124 Q92 142 100 162" stroke="#8a74d6" stroke-opacity=".55" stroke-width="2" fill="none"/>
      <!-- trainers -->
      <path d="M46 168 Q44 178 52 179 L68 179 Q70 174 62 170Z" fill="url(#shoe)"/>
      <path d="M46 176 L68 176" stroke="#ff3fa4" stroke-width="2.5"/>
      <path d="M96 164 Q94 176 102 177 L120 176 Q121 170 110 165Z" fill="url(#shoe)"/>
      <path d="M96 173 L120 173" stroke="#ff3fa4" stroke-width="2.5"/>
      <!-- hips/waistband -->
      <path d="M60 112 Q76 108 92 112 L90 124 Q76 121 62 124Z" fill="url(#leg)"/>
      <path d="M61 113 Q76 109 91 113" stroke="#c6ff00" stroke-width="2.5" fill="none"/>

      <!-- torso: fitted gym top -->
      <path d="M58 76 Q66 68 76 68 Q88 69 94 78 L92 112 Q76 108 60 112Z" fill="url(#top)"/>
      <path d="M76 70 L76 92" stroke="#7a0b47" stroke-width="1.6" stroke-opacity=".6"/>
      <path d="M64 80 Q66 96 64 108" stroke="#fff" stroke-opacity=".35" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- far arm -->
      <path d="M90 80 Q98 82 100 78" stroke="#e6a07c" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- near arm: shoulder -> elbow -> hand on handle -->
      <path d="M68 78 Q66 96 82 100 Q94 94 101 81" stroke="url(#top)" stroke-width="10" stroke-linecap="round" fill="none"/>
      <path d="M88 97 Q97 92 101 81" stroke="url(#skinL)" stroke-width="7.5" stroke-linecap="round" fill="none"/>
      <circle cx="101.5" cy="79.5" r="4.6" fill="url(#skin)"/>

      <!-- neck -->
      <path d="M70 58 L82 58 L81 71 Q76 74 71 71Z" fill="url(#skinL)"/>
      <!-- chain + cross -->
      <path d="M70 66 Q76 78 82 66" stroke="url(#gold)" stroke-width="1.8" fill="none"/>
      <g filter="none">
        <rect x="74.9" y="74" width="2.6" height="10" rx="1" fill="url(#gold)"/>
        <rect x="72.2" y="76.6" width="8" height="2.6" rx="1" fill="url(#gold)"/>
        <rect x="75.4" y="74.6" width=".9" height="8.6" fill="#fff" opacity=".7"/>
      </g>

      <!-- head -->
      <path d="M62 40 Q62 22 78 22 Q93 23 92 42 Q91 56 80 61 Q70 62 65 54 Q61 48 62 40Z" fill="url(#skin)"/>
      <!-- hair front, slicked back to high pony -->
      <path d="M60 42 Q58 20 78 18 Q94 18 94 36 Q88 28 78 28 Q70 28 66 34 Q63 38 63 48Z" fill="url(#hair)"/>
      <path d="M66 26 Q76 20 88 24" stroke="#fffbe0" stroke-width="2" fill="none" opacity=".9" stroke-linecap="round"/>
      <path d="M68 30 Q76 25 86 28" stroke="#c9961f" stroke-width="1" fill="none" opacity=".7"/>
      <!-- brows, eyes, lashes -->
      <path d="M73 36 Q77 34 80 36 M85 36 Q88 34 90 36.5" stroke="#8a5a1e" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="77" cy="41" rx="2.6" ry="3" fill="#fff"/><ellipse cx="87.5" cy="41" rx="2.3" ry="2.9" fill="#fff"/>
      <circle cx="77.6" cy="41.4" r="1.8" fill="#3c6fd1"/><circle cx="88" cy="41.4" r="1.7" fill="#3c6fd1"/>
      <circle cx="77.8" cy="41.6" r=".9" fill="#111"/><circle cx="88.2" cy="41.6" r=".85" fill="#111"/>
      <circle cx="77" cy="40.6" r=".6" fill="#fff"/><circle cx="87.4" cy="40.6" r=".55" fill="#fff"/>
      <path d="M74 39 Q77 37 80.5 38.6 M85 38.8 Q88 37 90.6 39" stroke="#111" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      <path d="M74.2 39.2 l-1.6 -1.4 M90.4 39.2 l1.5 -1.4" stroke="#111" stroke-width="1" stroke-linecap="round"/>
      <!-- nose, blush, glossy lips -->
      <path d="M83 43 Q84.5 47 82.5 48" stroke="#c97a55" stroke-width="1.1" fill="none" stroke-linecap="round"/>
      <ellipse cx="73.5" cy="48" rx="3.6" ry="2" fill="#ff6fa0" opacity=".35"/><ellipse cx="90" cy="48" rx="2.8" ry="1.8" fill="#ff6fa0" opacity=".3"/>
      <path d="M78 52 Q82.5 50.5 87 52 Q82.5 56.5 78 52Z" fill="#ff3f86"/>
      <path d="M80 52.4 Q82.5 53.4 85 52.4" stroke="#fff" stroke-width=".8" opacity=".7" fill="none"/>
      <!-- ear -->
      <path d="M64 42 Q60 44 62 50 Q64 52 66 50" fill="url(#skinL)"/>
      <!-- big gold hoop (near) -->
      <ellipse cx="64" cy="58" rx="7.5" ry="9" fill="none" stroke="url(#gold)" stroke-width="2.6"/>
      <path d="M58 54 Q57 60 60 64" stroke="#fffbd0" stroke-width="1" fill="none" opacity=".9"/>
      <!-- far hoop peeking -->
      <path d="M92 50 Q98 56 93 64" stroke="url(#gold)" stroke-width="2.2" fill="none"/>
    </g>
  </g>
  <circle cx="100" cy="100" r="96.5" fill="none" stroke="#1b1030" stroke-width="3"/>
</g>
<g transform="rotate(-5 100 172)">
<rect x="24" y="150" width="152" height="36" rx="9" fill="#5b2bd6" stroke="#1b1030" stroke-width="3.5"/>
<text x="100" y="176" text-anchor="middle" font-family="Inter Display" font-weight="900" font-size="22" letter-spacing=".5" fill="#fff200" stroke="#1b1030" stroke-width="5" paint-order="stroke" stroke-linejoin="round">SCATTY KATIE</text>
</g></svg>