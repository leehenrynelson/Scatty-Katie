<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#5b2bd6;transition:opacity .5s}
#splash img{width:min(56vw,260px);border-radius:22%;border:5px solid #1b1030;box-shadow:8px 8px 0 #ff3fa4}
#splash b{font-family:"Bungee","Arial Black",Impact,sans-serif;font-size:clamp(30px,10vw,52px);color:#fff200;text-shadow:3px 3px 0 #ff3fa4}
#splash.go{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){#splash img{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.4) rotate(-12deg)}}}

<body>
<div id="splash"><img src="icon-512.png" alt=""><b>Scatty Katie</b></div>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@400;700&family=Chewy&display=swap">
<style>
/* Layout: phone-first app shell — sticker header, tab bar, list or hand-drawn map, bottom sheet for directions. Deliberately clashing, single look. */
:root{
  --lime:#c6ff00; --pink:#ff3fa4; --purple:#5b2bd6; --orange:#ff8a00; --teal:#00c2b2; --yellow:#fff200;
  --ink:#1b1030; --paper:#fff7d6; --river:#4fc3ff; --land:#ffe7f3;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Comic Neue","Comic Sans MS","Chalkboard SE",cursive,sans-serif;
  --fun:"Chewy","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--lime);color:var(--ink);font-family:var(--body);font-size:16px;
  background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,63,164,.18) 22px 30px);}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;background:var(--purple);color:var(--yellow);border:4px solid var(--ink);border-radius:18px 4px 22px 6px;padding:10px 14px;box-shadow:6px 6px 0 var(--orange);transform:rotate(-.6deg)}
header svg{width:clamp(110px,30vw,140px);height:auto;flex:none;filter:drop-shadow(4px 4px 0 var(--pink))}
header h1{font-family:var(--display);font-size:clamp(28px,8vw,44px);line-height:.95;margin:0;text-shadow:3px 3px 0 var(--pink);text-wrap:balance}
header p{margin:4px 0 0;font-family:var(--fun);font-size:17px;color:#fff;letter-spacing:.02em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{font-family:var(--display);font-size:clamp(14px,4vw,18px);padding:12px 8px;border:4px solid var(--ink);cursor:pointer;color:var(--ink)}
.tab[data-k="spoons"]{background:var(--orange);border-radius:4px 16px 4px 16px;transform:rotate(1deg)}
.tab[data-k="pound"]{background:var(--teal);border-radius:16px 4px 16px 4px;transform:rotate(-1.2deg)}
.tab[aria-selected="true"]{box-shadow:0 0 0 4px var(--yellow),6px 6px 0 4px var(--pink);text-decoration:underline wavy var(--purple) 3px}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:4px dashed var(--purple);outline-offset:3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:3px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--paper)}
.seg button{font-family:var(--fun);font-size:18px;border:0;padding:8px 16px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--yellow)}
input[type=search]{flex:1 1 180px;min-width:0;font-family:var(--body);font-weight:700;font-size:16px;padding:10px 14px;border:3px solid var(--ink);border-radius:6px 20px 6px 20px;background:var(--yellow);color:var(--ink)}
.count{font-family:var(--fun);font-size:17px;background:var(--ink);color:var(--lime);padding:4px 10px;border-radius:12px;transform:rotate(2deg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{border:3px solid var(--ink);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.item:nth-child(5n+1){background:var(--paper)}
.item:nth-child(5n+2){background:#ffd1ea}
.item:nth-child(5n+3){background:#d4fff8}
.item:nth-child(5n+4){background:#fff200}
.item:nth-child(5n){background:#ffe1bd}
.item:nth-child(odd){border-radius:4px 14px 4px 14px}
.item:nth-child(even){border-radius:14px 4px 14px 4px}
.item h3{margin:0;font-family:var(--fun);font-size:20px;font-weight:400;line-height:1.1}
.item p{margin:3px 0 0;font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.badge{display:inline-block;font-family:var(--display);font-size:10px;padding:2px 6px;margin-left:6px;vertical-align:middle;background:var(--pink);color:#fff;border-radius:3px}
.btn{font-family:var(--display);font-size:12px;text-decoration:none;color:var(--ink);background:var(--lime);border:3px solid var(--ink);padding:9px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:3px 3px 0 var(--purple)}
.btn.alt{background:var(--orange)}
.btns{display:flex;flex-direction:column;gap:6px}
.mapbox{position:relative;border:4px solid var(--ink);border-radius:8px 26px 8px 26px;overflow:hidden;background:var(--land);height:min(68vh,560px);touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:grab}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;font-family:var(--display);font-size:20px;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:50%;cursor:pointer}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;background:var(--paper);border:3px solid var(--ink);border-radius:14px 4px 14px 4px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;box-shadow:5px 5px 0 var(--pink)}
.sheet h3{margin:0;font-family:var(--fun);font-weight:400;font-size:20px}
.sheet p{margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}
.close{position:absolute;top:-14px;right:-8px;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);color:#fff;font-weight:700;cursor:pointer}
.hint{font-family:var(--fun);font-size:15px;margin:0;background:var(--purple);color:var(--lime);padding:6px 10px;border-radius:6px;align-self:flex-start;transform:rotate(-1deg)}
footer{font-size:13px;line-height:1.4;background:var(--paper);border:3px dashed var(--ink);padding:10px 12px;border-radius:6px}
footer b{font-family:var(--fun);font-weight:400;font-size:16px}
@media (prefers-reduced-motion:no-preference){header svg .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}
</style>
