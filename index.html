<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scatty Katie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scatty Katie">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#5b2bd6">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@400;700&family=Chewy&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#5b2bd6;transition:opacity .5s}
#splash img{width:min(56vw,260px);border-radius:22%;border:5px solid #1b1030;box-shadow:8px 8px 0 #ff3fa4}
#splash b{font-family:"Bungee","Arial Black",Impact,sans-serif;font-size:clamp(30px,10vw,52px);color:#fff200;text-shadow:3px 3px 0 #ff3fa4}
#splash.go{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){#splash img{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}@keyframes pop{from{transform:scale(.4) rotate(-12deg)}}}

/* Layout: phone-first app shell — sticker header, tab bar, list or hand-drawn map, bottom sheet for directions. Deliberately clashing, single look. */
:root{
  --lime:#c6ff00; --pink:#ff3fa4; --purple:#5b2bd6; --orange:#ff8a00; --teal:#00c2b2; --yellow:#fff200;
  --ink:#1b1030; --paper:#fff7d6; --river:#4fc3ff; --land:#ffe7f3;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Comic Neue","Comic Sans MS","Chalkboard SE",cursive,sans-serif;
  --fun:"Chewy","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--lime);color:var(--ink);font-family:var(--body);font-size:16px;
  background-image:repeating-linear-gradient(45deg,transparent 0 22px,rgba(255,63,164,.18) 22px 30px);}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:12px;background:var(--purple);color:var(--yellow);border:4px solid var(--ink);border-radius:18px 4px 22px 6px;padding:10px 14px;box-shadow:6px 6px 0 var(--orange);transform:rotate(-.6deg)}
header svg{width:clamp(110px,30vw,140px);height:auto;flex:none;filter:drop-shadow(4px 4px 0 var(--pink))}
header h1{font-family:var(--display);font-size:clamp(28px,8vw,44px);line-height:.95;margin:0;text-shadow:3px 3px 0 var(--pink);text-wrap:balance}
header p{margin:4px 0 0;font-family:var(--fun);font-size:17px;color:#fff;letter-spacing:.02em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{font-family:var(--display);font-size:clamp(14px,4vw,18px);padding:12px 8px;border:4px solid var(--ink);cursor:pointer;color:var(--ink)}
.tab[data-k="spoons"]{background:var(--orange);border-radius:4px 16px 4px 16px;transform:rotate(1deg)}
.tab[data-k="pound"]{background:var(--teal);border-radius:16px 4px 16px 4px;transform:rotate(-1.2deg)}
.tab[aria-selected="true"]{box-shadow:0 0 0 4px var(--yellow),6px 6px 0 4px var(--pink);text-decoration:underline wavy var(--purple) 3px}
.tab:focus-visible,.btn:focus-visible,.seg button:focus-visible,input:focus-visible{outline:4px dashed var(--purple);outline-offset:3px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:3px solid var(--ink);border-radius:30px;overflow:hidden;background:var(--paper)}
.seg button{font-family:var(--fun);font-size:18px;border:0;padding:8px 16px;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:var(--yellow)}
input[type=search]{flex:1 1 180px;min-width:0;font-family:var(--body);font-weight:700;font-size:16px;padding:10px 14px;border:3px solid var(--ink);border-radius:6px 20px 6px 20px;background:var(--yellow);color:var(--ink)}
.count{font-family:var(--fun);font-size:17px;background:var(--ink);color:var(--lime);padding:4px 10px;border-radius:12px;transform:rotate(2deg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{border:3px solid var(--ink);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.item:nth-child(5n+1){background:var(--paper)}
.item:nth-child(5n+2){background:#ffd1ea}
.item:nth-child(5n+3){background:#d4fff8}
.item:nth-child(5n+4){background:#fff200}
.item:nth-child(5n){background:#ffe1bd}
.item:nth-child(odd){border-radius:4px 14px 4px 14px}
.item:nth-child(even){border-radius:14px 4px 14px 4px}
.item h3{margin:0;font-family:var(--fun);font-size:20px;font-weight:400;line-height:1.1}
.item p{margin:3px 0 0;font-size:14px;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.badge{display:inline-block;font-family:var(--display);font-size:10px;padding:2px 6px;margin-left:6px;vertical-align:middle;background:var(--pink);color:#fff;border-radius:3px}
.btn{font-family:var(--display);font-size:12px;text-decoration:none;color:var(--ink);background:var(--lime);border:3px solid var(--ink);padding:9px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;box-shadow:3px 3px 0 var(--purple)}
.btn.alt{background:var(--orange)}
.btns{display:flex;flex-direction:column;gap:6px}
.mapbox{position:relative;border:4px solid var(--ink);border-radius:8px 26px 8px 26px;overflow:hidden;background:var(--land);height:min(68vh,560px);touch-action:none}

.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;font-family:var(--display);font-size:20px;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:50%;cursor:pointer}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;background:var(--paper);border:3px solid var(--ink);border-radius:14px 4px 14px 4px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;box-shadow:5px 5px 0 var(--pink)}
.sheet h3{margin:0;font-family:var(--fun);font-weight:400;font-size:20px}
.sheet p{margin:2px 0 0;font-size:13px;overflow-wrap:anywhere}
.close{position:absolute;top:-14px;right:-8px;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);color:#fff;font-weight:700;cursor:pointer}
.hint{font-family:var(--fun);font-size:15px;margin:0;background:var(--purple);color:var(--lime);padding:6px 10px;border-radius:6px;align-self:flex-start;transform:rotate(-1deg)}
footer{font-size:13px;line-height:1.4;background:var(--paper);border:3px dashed var(--ink);padding:10px 12px;border-radius:6px}
footer b{font-family:var(--fun);font-weight:400;font-size:16px}
@media (prefers-reduced-motion:no-preference){header svg .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

.mapbox{height:min(70vh,600px)}
#map{position:absolute;inset:0;background:var(--land)}
.leaflet-container{font-family:var(--body)}
.leaflet-control-attribution{font-size:10px}
.near{font-family:var(--display);font-size:13px;border:3px solid var(--ink);background:var(--pink);color:#fff;padding:9px 12px;border-radius:20px 6px 20px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--purple)}
.near[aria-pressed="true"]{background:var(--purple);color:var(--lime)}
.dist{display:inline-block;font-family:var(--display);font-size:11px;background:var(--ink);color:var(--lime);padding:2px 6px;border-radius:4px;margin-top:5px}
.more{font-family:var(--display);font-size:14px;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);padding:12px;border-radius:12px;cursor:pointer;width:100%}
.msg{font-family:var(--fun);font-size:17px;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:10px 12px;margin:0}
</style>
</head>

<div><h1>Scatty Katie</h1><p>Every Spoons &amp; Poundland in England. Sorted.</p></div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" id="tab-spoons" role="tab" data-k="spoons" aria-selected="true">🍺 Spoons</button>
  <button class="tab" id="tab-pound" role="tab" data-k="pound" aria-selected="false">🛒 Poundland</button>
</div>

<div class="bar">
  <div class="seg" role="group" aria-label="View">
    <button id="v-list" aria-pressed="true">List</button>
    <button id="v-map" aria-pressed="false">Map</button>
  </div>
  <button class="near" id="near" aria-pressed="false">📍 Near me</button>
  <input id="q" type="search" placeholder="Town, postcode or name…" aria-label="Search">
  <span class="count" id="count"></span>
</div>
<p class="msg" id="msg" hidden></p>

<ul class="list" id="list"></ul>
<button class="more" id="more" hidden>Show more</button>

<div class="mapbox" id="mapbox" hidden>
  <div id="map"></div>
  <div class="sheet" id="sheet" hidden style="z-index:1000"></div>
</div>

<footer id="foot"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SETS={
  spoons:{url:"data/spoons.json",col:"#ff8a00",label:"Spoons",data:null,
    foot:"<b>Spoons</b> come straight from Wetherspoon's own pub finder, with their exact locations. Airport pubs are after security."},
  pound:{url:"data/poundland.json",col:"#00c2b2",label:"Poundland",data:null,
    foot:"<b>Poundland</b> stores come from OpenStreetMap, as Poundland's own finder can't be read. They've shut a lot of shops lately, so check before a big trip."}
};
let cur="spoons",view="list",q="",me=null,shown=60,meta=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dest=r=>r[1]?r[0]+", "+r[1]:r[2]+","+r[3];
const gmaps=r=>"https://www.google.com/maps/dir/?api=1&destination="+(r[1]?encodeURIComponent(dest(r)):r[2]+","+r[3]);
const amaps=r=>"https://maps.apple.com/?daddr="+encodeURIComponent(r[1]?dest(r):r[2]+","+r[3])+"&ll="+r[2]+","+r[3];
const miles=(a,b,c,d)=>{const R=3958.8,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const fmt=m=>m<0.1?"Right here":m<10?m.toFixed(1)+" mi":Math.round(m)+" mi";

async function load(k){const S=SETS[k];if(S.data)return S.data;
  try{const r=await fetch(S.url+"?t="+Date.now());if(!r.ok)throw 0;S.data=await r.json();}
  catch(e){try{const r=await fetch(S.url);S.data=await r.json();}catch(e2){S.data=[];}}
  return S.data;}

function rows(){let d=SETS[cur].data||[];const t=q.trim().toLowerCase();
  if(t)d=d.filter(r=>(r[0]+" "+r[1]+" "+(r[5]||"")).toLowerCase().includes(t));
  d=d.slice();
  if(me){d.forEach(r=>r._d=miles(me[0],me[1],r[2],r[3]));d.sort((a,b)=>a._d-b._d);}
  else d.sort((a,b)=>((a[5]||"")+a[0]).localeCompare((b[5]||"")+b[0]));
  return d;}
const btns=r=>`<div class="btns"><a class="btn" href="${gmaps(r)}" target="_blank" rel="noopener">➤ Take me</a><a class="btn alt" href="${amaps(r)}" target="_blank" rel="noopener">Apple Maps</a></div>`;
const card=r=>`<div style="min-width:0"><h3>${esc(r[0])}${r[4]?`<span class="badge">${esc(r[4])}</span>`:""}</h3><p>${esc(r[1]||r[5]||"")}</p>${me?`<span class="dist">${fmt(r._d)}</span>`:""}</div>${btns(r)}`;

function renderList(){const S=SETS[cur];
  if(!S.data){$("list").innerHTML=`<li class="item"><div><h3>Loading…</h3><p>Fetching every ${S.label} in England.</p></div></li>`;$("more").hidden=true;$("count").textContent="";return;}
  const rs=rows();
  $("list").innerHTML=rs.slice(0,shown).map(r=>`<li class="item">${card(r)}</li>`).join("")||`<li class="item"><div><h3>Nowt here, babe</h3><p>Try a different town or postcode.</p></div></li>`;
  $("more").hidden=rs.length<=shown;$("more").textContent=`Show more (${rs.length-shown} left)`;
  $("count").textContent=rs.length+" "+S.label;}

/* map */
let map=null,layer=null;
function ensureMap(){if(map)return;
  map=L.map("map",{preferCanvas:true,zoomControl:true}).setView([52.8,-1.6],6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
  map.on("click",()=>{$("sheet").hidden=true});}
function drawMap(){if(!map||!SETS[cur].data)return;
  if(layer)layer.remove();layer=L.layerGroup();const col=SETS[cur].col;
  rows().forEach(r=>{L.circleMarker([r[2],r[3]],{radius:7,color:"#1b1030",weight:2,fillColor:col,fillOpacity:1})
    .on("click",e=>{L.DomEvent.stopPropagation(e);sheet(r)}).addTo(layer)});
  layer.addTo(map);
  if(me)L.circleMarker(me,{radius:9,color:"#fff",weight:3,fillColor:"#ff3fa4",fillOpacity:1}).addTo(layer);}
function sheet(r){const s=$("sheet");s.innerHTML=`<button class="close" aria-label="Close">×</button>${card(r)}`;s.hidden=false;s.querySelector(".close").onclick=()=>{s.hidden=true};}

async function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===cur));
  $("v-list").setAttribute("aria-pressed",view==="list");$("v-map").setAttribute("aria-pressed",view==="map");
  $("list").hidden=view!=="list";$("mapbox").hidden=view!=="map";if(view!=="list")$("more").hidden=true;
  $("foot").innerHTML=SETS[cur].foot+(meta?` Lists last refreshed ${esc(meta.updated)}.`:"");
  $("sheet").hidden=true;
  if(view==="list")renderList();
  await load(cur);
  if(view==="list")renderList();else{$("count").textContent=rows().length+" "+SETS[cur].label;ensureMap();setTimeout(()=>{map.invalidateSize();drawMap();if(me)map.setView(me,12);},50);}
  try{localStorage.setItem("sk",JSON.stringify({cur,view}))}catch(e){}
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.k;shown=60;render()});
$("v-list").onclick=()=>{view="list";render()};$("v-map").onclick=()=>{view="map";render()};
$("more").onclick=()=>{shown+=60;renderList()};
let qt;$("q").addEventListener("input",e=>{q=e.target.value;shown=60;clearTimeout(qt);qt=setTimeout(()=>{if(view==="list")renderList();else{drawMap();$("count").textContent=rows().length+" "+SETS[cur].label;}},150)});
$("near").onclick=()=>{
  if(me){me=null;$("near").setAttribute("aria-pressed","false");$("msg").hidden=true;render();return;}
  if(!navigator.geolocation){say("Your phone won't share location with this app.");return;}
  $("near").textContent="📍 Finding you…";
  navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.latitude,p.coords.longitude];$("near").textContent="📍 Near me";$("near").setAttribute("aria-pressed","true");$("msg").hidden=true;shown=60;render();},
    ()=>{$("near").textContent="📍 Near me";say("Couldn't get your location. Allow location for Safari in Settings, then try again.");},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});};
function say(t){$("msg").textContent=t;$("msg").hidden=false;}

try{const s=JSON.parse(localStorage.getItem("sk")||"null");if(s&&SETS[s.cur]){cur=s.cur;view=s.view==="map"?"map":"list";}}catch(e){}
fetch("data/meta.json?t="+Date.now()).then(r=>r.json()).then(m=>{meta=m;$("foot").innerHTML=SETS[cur].foot+` Lists last refreshed ${esc(m.updated)}.`}).catch(()=>{});
render();
</script>
<script>
setTimeout(()=>{const s=document.getElementById("splash");s.classList.add("go");setTimeout(()=>s.remove(),600)},1400);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
